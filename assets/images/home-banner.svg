 <g transform="translate(1765 118)"><path d="M30 0h125v250l-30 35H30L0 250V40z" fill="url(#card)" stroke="#a9a1c1" stroke-width="3"/><path d="M36 55q27-18 52 0v72q-25-18-52 0zM88 55q27-18 52 0v72q-25-18-52 0z" class="line"/><text x="78" y="178" font-size="29" fill="#f0e7ef" font-weight="bold">Blogs</text><text x="78" y="215" font-size="17" fill="#d4cbdc">Ideas • Guides</text><text x="78" y="239" font-size="17" fill="#d4cbdc">Lifestyle • Tech</text></g>
</g>
