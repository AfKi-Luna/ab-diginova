<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 520" role="img" aria-labelledby="title desc">
<title id="title">A&amp;B DigiNova Home Banner</title><desc id="desc">Muted neon digital universe homepage banner with navigation, Afki and Bari illustration silhouettes, DigiNova logo and three feature cards.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171b30"/><stop offset=".55" stop-color="#25233e"/><stop offset="1" stop-color="#172c3d"/></linearGradient>
 <linearGradient id="neon" x2="1" y2="1"><stop stop-color="#a8c8d7"/><stop offset=".5" stop-color="#c6a6cb"/><stop offset="1" stop-color="#d7a9c5"/></linearGradient>
 <linearGradient id="card" x2="0" y2="1"><stop stop-color="#35334d"/><stop offset="1" stop-color="#202d40"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#a68cb7" stop-opacity=".24"/><stop offset="1" stop-color="#a68cb7" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
 <style>.script{font-family:'Brush Script MT','Segoe Script',cursive;font-style:italic}.sans{font-family:Arial, sans-serif}.muted{fill:#e8dce9}.line{stroke:url(#neon);stroke-width:2;fill:none}</style>
</defs>
<rect width="1920" height="520" rx="24" fill="url(#bg)"/>
<ellipse cx="950" cy="270" rx="900" ry="300" fill="url(#glow)"/>
