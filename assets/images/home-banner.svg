</g>
<g stroke="#9cb5ca" opacity=".35" stroke-width="2"><path d="M0 365H1920M0 405H1920M0 445H1920"/><path d="M120 365l-80 155M360 365l-40 155M650 365l-10 155M940 365l20 155M1250 365l50 155M1550 365l90 155M1810 365l70 155"/></g>
