<text x="62" y="64" class="script" font-size="43" fill="#ead9e8">A&amp;B DigiNova</text>
<g class="sans" font-size="22" fill="#eee7ef" text-anchor="middle"><text x="850" y="59">Home</text><text x="970" y="59">Academy</text><text x="1090" y="59">Store</text><text x="1190" y="59">Blogs</text><text x="1290" y="59">About</text><text x="1390" y="59">Contact</text></g>
<path d="M815 75h70" stroke="#d4a9c7" stroke-width="4" stroke-linecap="round"/>
<g fill="none" stroke="#e9ddea" stroke-width="3"><circle cx="1500" cy="50" r="14"/><path d="M1510 61l13 13M1560 37c-20 0-20 28 0 28 20 0 20-28 0-28zM1615 35v28m-12-14h24"/><path d="M1670 40q18-18 36 0v22h-36z"/></g>
