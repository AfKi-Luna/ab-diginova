<!-- face -->
<path d="M300 285 Q320 205 407 208 Q493 215 500 315 L484 440 Q460 520 399 535 Q331 515 309 440Z" fill="#e8b9ad" stroke="#a97983" stroke-width="5"/>
<path d="M302 310Q302 230 375 205Q453 183 496 260Q456 230 417 248Q356 276 302 310Z" fill="url(#hair)"/>
<!-- eyes, glasses, expression -->
<g fill="#34283d"><ellipse cx="357" cy="365" rx="12" ry="17"/><ellipse cx="442" cy="365" rx="12" ry="17"/></g>
<g fill="#fff"><circle cx="361" cy="359" r="4"/><circle cx="446" cy="359" r="4"/></g>
<g fill="none" stroke="#30263c" stroke-width="7"><rect x="320" y="337" width="76" height="57" rx="20"/><rect x="405" y="337" width="76" height="57" rx="20"/><path d="M396 355Q400 348 405 355"/></g>
<path d="M385 421Q400 432 415 420" fill="none" stroke="#9c5e73" stroke-width="5" stroke-linecap="round"/>
<path d="M345 320Q365 306 384 317M420 317Q442 305 462 321" fill="none" stroke="#553647" stroke-width="8" stroke-linecap="round"/>
<!-- hoodie shoulders -->
<path d="M270 565Q300 510 345 510L400 555L455 510Q520 525 548 590L570 760H230Z" fill="url(#hood)" stroke="#8f82aa" stroke-width="7"/>
<path d="M345 520Q400 600 455 520" fill="none" stroke="#d3a9d5" stroke-width="6"/>
<text x="400" y="655" text-anchor="middle" fill="#f4c8e9" font-family="Georgia,serif" font-size="52" font-style="italic">AB</text>
<!-- Bari fluffy companion -->
<g>
 <circle cx="555" cy="545" r="112" fill="#eee6f5" stroke="#c5a9dc" stroke-width="8"/>
 <g fill="#f7f1fb"><circle cx="475" cy="500" r="42"/><circle cx="505" cy="450" r="43"/><circle cx="555" cy="438" r="45"/><circle cx="605" cy="460" r="44"/><circle cx="640" cy="510" r="42"/><circle cx="470" cy="570" r="42"/><circle cx="635" cy="580" r="42"/></g>
 <g fill="none" stroke="#322a40" stroke-width="7"><circle cx="520" cy="535" r="23"/><circle cx="586" cy="535" r="23"/><path d="M543 535h20"/></g>
 <path d="M540 580Q555 598 574 579" fill="none" stroke="#8d547e" stroke-width="7" stroke-linecap="round"/>
 <ellipse cx="496" cy="570" rx="15" ry="9" fill="#e9a5bb"/><ellipse cx="612" cy="570" rx="15" ry="9" fill="#e9a5bb"/>
 <path d="M521 620Q555 600 590 620L598 673Q555 700 512 673Z" fill="#d9b35e" stroke="#a67e43" stroke-width="4"/>
 <text x="555" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#59435b" font-weight="bold">Bari</text>
</g>
<!-- title and loading -->
<text x="400" y="805" text-anchor="middle" fill="#f6c8ed" font-family="Georgia,serif" font-size="72" font-style="italic">AB DigiNova</text>
<text x="400" y="858" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="27">Initializing DigiNova...</text>
<rect x="165" y="890" width="470" height="22" rx="11" fill="#18253c" stroke="#b9a0d1" stroke-width="3"/>
<rect x="168" y="893" width="356" height="16" rx="8" fill="url(#bar)"/>
<text x="650" y="912" fill="#ffffff" font-family="Arial,sans-serif" font-size="25">76%</text>
<text x="400" y="960" text-anchor="middle" fill="#aeb7d4" font-family="Arial,sans-serif" font-size="16" letter-spacing="4">LOADING SCREEN  •  0–1s</text>
</svg>
