<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10172f"/><stop offset=".55" stop-color="#29213f"/><stop offset="1" stop-color="#101d35"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#f4b7e8" stop-opacity=".55"/><stop offset=".55" stop-color="#a879c9" stop-opacity=".2"/><stop offset="1" stop-color="#6bdce2" stop-opacity="0"/></radialGradient>
 <linearGradient id="ring" x2="1" y2="1"><stop stop-color="#ffc5ee"/><stop offset=".45" stop-color="#9ce9ef"/><stop offset="1" stop-color="#d59bdf"/></linearGradient>
 <linearGradient id="hair" x2=".8" y2="1"><stop stop-color="#b98583"/><stop offset=".4" stop-color="#35253d"/><stop offset="1" stop-color="#171c32"/></linearGradient>
 <linearGradient id="hood" x2="1" y2="1"><stop stop-color="#6b5a86"/><stop offset="1" stop-color="#243f57"/></linearGradient>
 <linearGradient id="bar" x2="0" y2="1"><stop stop-color="#f5b9e8"/><stop offset="1" stop-color="#b77ec8"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="800" height="1000" fill="url(#bg)"/>
<circle cx="400" cy="410" r="360" fill="url(#halo)"/>
<!-- digital particles -->
<g fill="none" stroke="#9de8f2" opacity=".7"><path d="M75 210h24v24H75zM682 160h18v18h-18zM110 570h14v14h-14zM700 620h20v20h-20z"/><path d="M150 120h8v8h-8M640 300h9v9h-9" stroke="#f3b5e7"/></g>
<g fill="#c99bdc" opacity=".8"><circle cx="120" cy="350" r="4"/><circle cx="675" cy="420" r="3"/><circle cx="170" cy="700" r="3"/><circle cx="630" cy="720" r="4"/></g>
<!-- luminous portal -->
<circle cx="400" cy="410" r="300" fill="none" stroke="#b88acb" stroke-width="30" opacity=".18" filter="url(#glow)"/>
<circle cx="400" cy="410" r="286" fill="none" stroke="url(#ring)" stroke-width="9" opacity=".9"/>
<circle cx="400" cy="410" r="268" fill="none" stroke="#f5c5ef" stroke-width="2" stroke-dasharray="7 15" opacity=".7"/>
<circle cx="400" cy="410" r="248" fill="#20243c" opacity=".38"/>
